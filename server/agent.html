<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Missioners — спека роли</title>
<meta name="description" content="Спека роли для агента по ключу из лобби.">
<style>
/* Страница роли агента: сервер отдаёт её по ключу (/agent/КЛЮЧ) и рядом — markdown спеки роли с подставленным ключом (/agent/КЛЮЧ.md);
   страница рендерит его на клиенте. Без ключа смысла не имеет; на сайте игры её нет — ссылку человек получает в лобби и отдаёт агенту. */
:root{--bg:#0b0d10;--panel:#12151a;--line:#232830;--fg:#c9d1d9;--dim:#6b7480;--acc:#e0a94a;--grn:#9fb59f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 ui-monospace,Menlo,monospace}
main{max-width:860px;margin:0 auto;padding:40px 16px 80px}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px}
header h1{font-size:15px;letter-spacing:.2em;color:var(--acc);margin:0}
header .dim{color:var(--dim)}
a{color:var(--grn)}
nav#toc{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:0 0 28px;background:var(--panel);font-size:13px}
nav#toc a{display:inline-block;margin:2px 14px 2px 0;color:var(--grn);text-decoration:none}
nav#toc a:hover{text-decoration:underline}
#doc h1{display:none}
#doc h2{font-size:12px;letter-spacing:.14em;color:var(--acc);margin:40px 0 12px;text-transform:uppercase}
#doc h3{font-size:14px;color:#fff;font-weight:normal;margin:26px 0 8px}
#doc p{margin:0 0 12px}
#doc ul,#doc ol{margin:0 0 12px;padding-left:22px}
#doc li{margin:4px 0}
#doc strong{color:#fff;font-weight:normal}
#doc em{color:var(--grn);font-style:normal}
code{background:#000;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--grn);font-size:13px}
#doc code{background:#000;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--grn);font-size:13px}
#doc pre{background:#000;border:1px solid var(--line);border-radius:6px;padding:12px 14px;color:var(--grn);font-size:13px;overflow-x:auto;margin:0 0 12px}
#doc pre code{border:none;padding:0;background:none}
#doc table{border-collapse:collapse;margin:0 0 14px;font-size:13px;width:100%}
#doc th,#doc td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
#doc th{color:var(--dim);font-weight:normal}
#doc h2 a,#doc h3 a{color:inherit;text-decoration:none}
.err{color:#d9534f}
@media (max-width:600px){#doc table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<main>
<header>
  <h1>MISSIONERS · СПЕКА РОЛИ</h1>
  <span class="dim">ключ внутри · не публиковать</span>
  <a id="raw" href="">сырой markdown — для модели (с ключом)</a>
  <a href="/">лобби</a>
</header>
<nav id="toc"></nav>
<div id="doc"><span class="dim">…</span></div>
</main>
<script>
// Маленький рендер markdown: заголовки, абзацы, списки, таблицы, блоки кода, инлайн-код, жирный, курсив, ссылки. Ровно то, что есть в agent-api.md.
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){ const codes=[]; s=esc(s).replace(/`([^`]+)`/g,(_,c)=>{ codes.push(c); return '\u0001'+(codes.length-1)+'\u0001'; });
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
  return s.replace(/\u0001(\d+)\u0001/g,(_,i)=>'<code>'+codes[+i]+'</code>'); }
const slug=t=>t.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'');
function render(md){ const L=md.split('\n'); const out=[]; const toc=[]; let i=0;
  const para=[]; const flush=()=>{ if(para.length){ out.push('<p>'+inline(para.join(' '))+'</p>'); para.length=0; } };
  while(i<L.length){ const l=L[i];
    if(/^```/.test(l)){ flush(); const b=[]; i++; while(i<L.length&&!/^```/.test(L[i])) b.push(L[i++]); i++; out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>'); continue; }
    const h=/^(#{1,3})\s+(.*)$/.exec(l); if(h){ flush(); const lvl=h[1].length, t=inline(h[2]), id=slug(h[2]); if(lvl===2) toc.push({id,t}); out.push(`<h${lvl} id="${id}"><a href="#${id}">${t}</a></h${lvl}>`); i++; continue; }
    if(/^\|/.test(l)){ flush(); const rows=[]; while(i<L.length&&/^\|/.test(L[i])) rows.push(L[i++]); const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      const head=cells(rows[0]); const body=rows.slice(/^\|\s*-/.test(rows[1]||'')?2:1).map(cells);
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'); continue; }
    const li=/^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(l); if(li){ flush(); const ol=/\d/.test(li[2]); const items=[]; while(i<L.length){ const m=/^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(L[i]); if(!m) break; items.push(m[3]); i++; while(i<L.length&&/^\s{2,}\S/.test(L[i])&&!/^\s*([-*]|\d+\.)\s/.test(L[i])) items[items.length-1]+=' '+L[i++].trim(); }
      out.push((ol?'<ol>':'<ul>')+items.map(t=>'<li>'+inline(t)+'</li>').join('')+(ol?'</ol>':'</ul>')); continue; }
    if(!l.trim()){ flush(); i++; continue; }
    para.push(l.trim()); i++; }
  flush(); return {html:out.join('\n'), toc}; }
// /agent/КЛЮЧ — спека роли с подставленным ключом: markdown лежит рядом, /agent/КЛЮЧ.md
const byKey=/^\/agent\/[^/]+$/.test(location.pathname); const src=byKey?location.pathname+'.md':''; document.getElementById('raw').href=src;
if(!byKey) document.getElementById('doc').innerHTML='<p class="err">нужен ключ: страница открывается по ссылке из лобби — /agent/КЛЮЧ</p>'; else fetch(src,{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); }).then(md=>{ const {html,toc}=render(md); document.getElementById('doc').innerHTML=html; document.getElementById('toc').innerHTML=toc.map(t=>`<a href="#${t.id}">${t.t}</a>`).join('');
    if(byKey){ const h=document.querySelector('#doc h1'); if(h){ document.querySelector('header h1').textContent=h.textContent.toUpperCase(); document.title='Missioners — '+h.textContent; } } if(location.hash){ const el=document.getElementById(decodeURIComponent(location.hash.slice(1))); if(el) el.scrollIntoView(); } })
  .catch(e=>{ document.getElementById('doc').innerHTML=`<p class="err">спека не загрузилась (${e.message}): <a href="${src}">${src}</a></p>`; });
</script>
</body>
</html>
