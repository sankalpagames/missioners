<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ares-tk — станции</title>
<link rel="stylesheet" href="style.css">
<style>
/* Лобби сетевой игры: терминал корпоративного инструментария. Раздаётся только сервером (server/), на GitHub Pages его нет. */
body{overflow:auto;background:#000;color:#9fb59f;font:15px/1.6 ui-monospace,Menlo,monospace;display:block}
#lobby{padding:60px 80px;max-width:900px}
#lobby h1{font-size:15px;font-weight:normal;margin:0 0 1em}
#lobby input,#lobby textarea{background:#000;color:#cfe3cf;border:none;border-bottom:1px solid #3a4a3a;font:inherit;padding:0 4px;width:14ch;outline:none}
#lobby select{background:#000;color:#cfe3cf;border:none;border-bottom:1px solid #3a4a3a;font:inherit;padding:0 2px;outline:none}
#lobby input:focus,#lobby textarea:focus{border-color:#9fb59f}
#lobby button{background:none;color:#9fb59f;border:1px solid #3a4a3a;font:inherit;padding:0 10px;cursor:pointer}
#lobby button:hover{border-color:#9fb59f;color:#cfe3cf}
#lobby .dim{color:#5f735f}
#lobby .row{margin:.4em 0}
/* комната — блок: шапка (код, карта, состояние, часы, действия игры), строки платформ и стаи одной сеткой, внизу — файл комнаты (архив) */
#rooms{margin:.5em 0 1.2em}
.room{border:1px solid #2a352a;padding:8px 12px;margin:8px 0;max-width:820px}
.room .head{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-bottom:6px}
.room .head b{font-weight:normal;color:#cfe3cf}
.room .head .act{margin-left:auto;display:flex;gap:8px;align-items:baseline}
.room .note{color:#cfe3cf;margin:-2px 0 6px}
.room .grid{display:grid;grid-template-columns:9ch minmax(16ch,1fr) 13ch auto auto;gap:3px 14px;align-items:baseline}
.room .grid > span{white-space:nowrap}
.room .grid .ops{white-space:normal}
#lobby button.small{padding:0 6px;font-size:13px}
/* файл комнаты — не действие игры: текстом, тускло, отдельно под сеткой */
.room .file{display:flex;justify-content:flex-end;margin-top:4px}
#lobby .room .file button{border:none;color:#5f735f;font-size:12px;padding:0}
#lobby .room .file button:hover{color:#9fb59f}
/* остановка: сообщение остальным, пауза или заявка на победу */
.room .stopf{border-top:1px dashed #2a352a;margin-top:8px;padding-top:6px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
#lobby .room .stopf textarea{width:100%;height:3.2em;resize:vertical;border:1px solid #2a352a}
/* архив: свёрнутый список комнат, в которые не войти — только смотреть */
#arch{margin:0 0 1.2em}
#arch summary{cursor:pointer;color:#5f735f}
#arch summary:hover{color:#9fb59f}
#arch .room{opacity:.75}
</style>
</head>
<body>
<div id="lobby">
<h1>$ ares-tk --key ~/old/dse.key stations</h1>
<div class="row">оператор: <input id="op" maxlength="24" spellcheck="false"></div>
<div class="row">комнаты по кэшированной таблице DSE:</div>
<div id="rooms"><div class="dim">…</div></div>
<details id="arch" hidden><summary>архив</summary><div id="archive"></div></details>
<div class="row">новая комната: <input id="code" maxlength="32" spellcheck="false" pattern="[\w-]+"> · карта <select id="map"></select> · платформ <select id="n"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select> · канал <select id="cap"><option value="512">512 бит/с</option><option value="1024">1024 бит/с</option><option value="2048">2048 бит/с</option><option value="4096">4096 бит/с</option></select> <button id="go">создать</button></div>
<div class="row dim"># платформ — сколько допускает карта · одна роль — один игрок · код комнаты — приглашение</div>
<div class="row dim" id="err"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const opKey='missioners.op';
function op(){ try{ return JSON.parse(localStorage.getItem(opKey))||{}; }catch(e){ return {}; } }
function saveOp(name){ const o=op(); if(!o.token) o.token=[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join(''); o.name=name.trim().slice(0,24); localStorage.setItem(opKey,JSON.stringify(o)); return o; }
const genCode=()=>'ark-'+[...crypto.getRandomValues(new Uint8Array(3))].map(b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
$('#op').value=op().name||''; $('#code').value=genCode();
$('#op').onchange=()=>saveOp($('#op').value);
const me=()=>op().name||'человек';
const fmtT=t=>{ const m=Math.floor(t/60), s=Math.floor(t%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; };
const ago=ms=>{ const s=Math.max(0,ms)/1000; if(s<5) return 'только что'; if(s<90) return `${s.toFixed(0)} с назад`; if(s<5400) return `${(s/60).toFixed(0)} мин назад`; if(s<172800) return `${(s/3600).toFixed(1)} ч назад`; return `${(s/86400).toFixed(1)} д назад`; };
// карты сервера — в выбор; число платформ — из карты (players: раскладки уровня), стая не в счёт
fetch('maps').then(r=>r.json()).then(maps=>{ for(const x of maps) MAPS[x.id]=x.name; const m=$('#map'); m.innerHTML=maps.map(x=>`<option value="${x.id}" data-players="${(x.players||[]).join(',')}">${x.name}</option>`).join('');
  const fit=()=>{ const P=(m.selectedOptions[0].dataset.players||'1,2,3,4').split(',').map(Number); for(const o of $('#n').options){ o.disabled=!P.includes(+o.value); o.hidden=o.disabled; } if(!P.includes(+$('#n').value)) $('#n').value=String(P.includes(2)?2:P[0]); };
  m.onchange=fit; fit(); }).catch(()=>{});
function join(code,st=0){ code=code.trim(); if(!/^[\w-]{1,32}$/.test(code)){ $('#err').textContent='код: латиница, цифры, дефис, до 32 знаков'; return; } saveOp($('#op').value); location.href='index.html?room='+encodeURIComponent(code)+'&st='+st; }
async function create(){ const code=$('#code').value.trim(); if(!/^[\w-]{1,32}$/.test(code)){ $('#err').textContent='код: латиница, цифры, дефис, до 32 знаков'; return; }
  try{ const r=await fetch('rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,map:$('#map').value,n:+$('#n').value,cap:+$('#cap').value})}); if(!r.ok) throw new Error(await r.text()||r.status);
    await r.json(); }catch(e){ $('#err').textContent='сервер отказал: '+e.message; return; }
  $('#err').textContent=''; $('#code').value=genCode(); await refresh(); const el=document.getElementById('room-'+code); if(el) el.scrollIntoView({block:'nearest'}); }   // в комнату не входим: она в списке, вход — «подключиться»
$('#go').onclick=create; $('#code').onkeydown=e=>{ if(e.key==='Enter') create(); };
const el=(tag,cls,text)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; };
const btn=(text,title,fn)=>{ const b=el('button','small',text); b.title=title; b.onclick=fn; return b; };
let openStop=null;   // код комнаты с раскрытой формой остановки: перерисовка раз в 5 с её не закрывает
async function refresh(){ if(openStop&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.stopf')) return;   // пока пишут сообщение — список не трогаем
  try{ const all=await fetch('rooms').then(r=>r.json()); const box=$('#rooms'), abox=$('#archive'); box.innerHTML=''; abox.innerHTML='';
    const rooms=all.filter(r=>!r.archived), arch=all.filter(r=>r.archived).sort((a,b)=>b.archived.wall.localeCompare(a.archived.wall));
    if(!rooms.length) box.innerHTML='<div class="dim">комнат нет — создать новую</div>';
    $('#arch').hidden=!arch.length; $('#arch summary').textContent=`архив · ${arch.length}`;   // details живёт вне перерисовки — раскрытый остаётся раскрытым
    for(const r of [...rooms,...arch]) (r.archived?abox:box).appendChild(roomBlock(r));
  }catch(e){ $('#rooms').innerHTML='<div class="dim">список недоступен</div>'; } }
function roomBlock(r){ const c=r.cfg||{cap:512}, A0=!!r.archived; const P=el('div','room'); P.id='room-'+r.code;
  const win=w=>`победа: ${w.side} (${w.name}) · ${w.confirmed?'подтверждена миром':'заявлена'}`;
  const state=r.stopped?(r.winner&&r.stopped.reason==='win'?win(r.winner):`пауза · ${r.stopped.by}`):!r.running?'стоит · '+ago(Date.now()-r.savedAt):(Date.now()-r.lastCmd<60000?'идёт · команды':'идёт · тишина');   // стоит — операторов нет; идёт — мир считается; команды — за последнюю минуту кто-то что-то делал
  const disp=(!r.stopped&&r.disputed?' · продолжена после заявления победы':'')+(A0?` · в архиве с ${new Date(r.archived.wall).toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})}`:'');
  const H=el('div','head'); H.appendChild(el('b','',r.code)); H.appendChild(el('span','dim',mapName(c.map))); H.appendChild(el('span','',state+disp)); H.appendChild(el('span','dim',`часы мира ${fmtT(r.t)} · ${c.cap} бит/с`));
  const A=el('div','act');
  A.appendChild(btn('наблюдать','Смотреть партию живьём: вся карта, все стороны, правда о мире. Мир не запускает',()=>window.open('spectate.html?room='+encodeURIComponent(r.code),'_blank')));
  A.appendChild(btn('повтор','Повтор партии с начала: запись мира с ползунком',()=>window.open('spectate.html?log='+encodeURIComponent('/log/'+r.code+'.log'),'_blank')));
  if(!A0&&r.stopped) A.appendChild(btn('возобновить','Снять остановку: операторы и агенты снова могут войти. После заявленной победы — оспаривает её',()=>resumeRoom(r.code,r.winner)));
  else if(!A0&&r.running) A.appendChild(btn('пауза','Остановить игру для всех — с сообщением остальным или с заявкой на победу',()=>{ openStop=openStop===r.code?null:r.code; refresh(); }));   // пауза — только когда игра идёт
  H.appendChild(A); P.appendChild(H);
  // сообщение остановившего (пауза) или пояснение победителя
  const note=r.stopped&&(r.stopped.note||r.winner&&r.winner.note); if(note) P.appendChild(el('div','note','«'+note+'»'));
  const G=el('div','grid');
  // одна роль — один игрок: занятая станция — с именем того, кто держит, без кнопки входа
  for(const s of r.stations){ const h=s.holder; G.appendChild(el('span','',s.name)); G.appendChild(el('span','ops '+(h?'':'dim'),h?h.name:'свободна')); G.appendChild(el('span','dim',`${s.alive} жив. из ${s.units}`));
    const bb=el('span'); if(A0){ G.appendChild(bb); G.appendChild(el('span')); continue; }
    if(h){ bb.className='dim'; bb.textContent='занята'; bb.title='с '+new Date(h.since).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})+'; свободна после выхода или 10 мин тишины'; } else bb.appendChild(btn('подключиться','Войти за эту платформу',()=>join(r.code,s.k)));
    G.appendChild(bb); G.appendChild(agentLink(r,'op'+s.k)); }
  G.appendChild(el('span','dim','стая')); G.appendChild(el('span',r.pack?'ops':'dim',r.pack?r.pack.name:'свободна')); G.appendChild(el('span')); G.appendChild(el('span')); G.appendChild(A0?el('span'):agentLink(r,'pack'));   // стая — своя строка: за неё тоже может сесть агент
  P.appendChild(G);
  if(!A0&&openStop===r.code&&r.running&&!r.stopped) P.appendChild(stopForm(r));
  // файл комнаты: архив — не действие игры
  const F=el('div','file');
  if(A0) F.appendChild(btn('вернуть из архива','Вернуть в список: остановка остаётся, дальше — «возобновить» или подключение',()=>roomAct(r.code,'unarchive')));
  else F.appendChild(btn('в архив','Убрать из списка: комната остановится, войти нельзя, только наблюдать и повтор',()=>archiveRoom(r.code)));
  P.appendChild(F); return P; }
// остановка: сообщение остальным (увидят в лобби, в консоли и агенты) — пауза или заявка на победу за роль; факт мира сервер проверит сам
function stopForm(r){ const f=el('div','stopf'); const t=el('textarea'); t.maxLength=200; t.placeholder='сообщение остальным — необязательно'; f.appendChild(t);
  f.appendChild(btn('пауза','Остановить для всех: консоли отключатся, агенты потеряют сессии; мир сохранится',()=>stopRoom(r.code,{note:t.value})));
  const who=el('select'); for(const s of r.stations){ const o=el('option','',s.name); o.value='op'+s.k; who.appendChild(o); } { const o=el('option','','стая'); o.value='pack'; who.appendChild(o); }
  f.appendChild(el('span','dim','·')); f.appendChild(btn('претендовать на победу','Остановить игру и заявить победу выбранной стороны. Подтверждена миром — если есть факт (планшет на складе платформы; у стаи — живы все особи, живые при входе), иначе — заявлена',()=>stopRoom(r.code,{note:t.value, reason:'win', role:who.value, name:me()})));
  f.appendChild(el('span','dim','за')); f.appendChild(who);
  f.appendChild(btn('отмена','',()=>{ openStop=null; refresh(); }));
  setTimeout(()=>t.focus(),0); return f; }
let MAPS={}; const mapName=id=>MAPS[id]||id||'';
// Ссылка для агента: спека роли с ключом входа. Ключи отдаёт сервер вместе со списком комнат — они видны всем, как и код комнаты:
// авторизации в игре нет. Человек отдаёт ссылку своему агенту (модели, скрипту); проверки «человек или агент» на входе нет
function agentLink(r,role){ const K=r.keys; const key=K&&(role==='pack'?K.pack:K.ops[+role.slice(2)]); if(!key) return el('span','dim','—');
  const url=location.origin+location.pathname.replace(/[^/]*$/,'')+'agent/'+encodeURIComponent(key);
  const b=btn('ссылка для агента ⧉','Скопировать ссылку на инструкцию для агента: спека роли с ключом входа — отдать модели или скрипту',()=>{ navigator.clipboard.writeText(url); b.textContent='скопировано ✓'; setTimeout(()=>{ b.textContent='ссылка для агента ⧉'; },1500); });
  return b; }
async function stopRoom(code,q){ openStop=null; try{ await fetch('rooms/'+encodeURIComponent(code)+'/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({by:me()+' из лобби', ...q})}); }catch(e){} refresh(); }
async function resumeRoom(code,winner){ if(winner&&!confirm(`Возобновить ${code}? Заявленная победа (${winner.side}, ${winner.name}) будет оспорена и уйдёт в историю комнаты`)) return; try{ await fetch('rooms/'+encodeURIComponent(code)+'/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({by:me()+' из лобби'})}); }catch(e){} refresh(); }
async function roomAct(code,act){ try{ await fetch('rooms/'+encodeURIComponent(code)+'/'+act,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({by:me()+' из лобби'})}); }catch(e){} refresh(); }
function archiveRoom(code){ if(confirm(`Комнату ${code} — в архив? Она остановится для всех, войти будет нельзя, только наблюдать`)) roomAct(code,'archive'); }
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
